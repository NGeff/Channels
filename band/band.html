<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globo SP — Ao Vivo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
  }

  video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000;
    z-index: 1;
  }

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.88);
    cursor: pointer;
    gap: 16px;
    font-family: sans-serif;
    color: rgba(255,255,255,0.7);
    font-size: 14px;
  }

  #overlay.hidden { display: none; }

  .play-btn {
    width: 72px; height: 72px;
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: rgba(255,255,255,0.1);
    transition: background 0.2s;
  }

  #overlay:hover .play-btn { background: rgba(255,255,255,0.2); }

  #msg {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    font-family: sans-serif;
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    background: rgba(0,0,0,0.5);
    padding: 5px 14px;
    border-radius: 20px;
    white-space: nowrap;
    transition: opacity 0.6s;
  }

  #msg.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<video id="video" playsinline></video>

<div id="overlay" class="hidden">
  <div class="play-btn">▶</div>
  <span>Clique para assistir</span>
</div>

<div id="msg">Carregando transmissão...</div>

<script>
const video   = document.getElementById('video');
const overlay = document.getElementById('overlay');
const msg     = document.getElementById('msg');
const SRC     = 'https://canais.fazoeli.co.za/fontes/smart/band.m3u8';

function showMsg(text, autohide = false) {
  msg.textContent = text;
  msg.classList.remove('hide');
  if (autohide) setTimeout(() => msg.classList.add('hide'), 3000);
}

function tryPlay() {
  video.play().then(() => {
    overlay.classList.add('hidden');
    showMsg('▶ Ao vivo', true);
  }).catch(() => {
    video.muted = true;
    video.play().then(() => {
      overlay.classList.add('hidden');
      showMsg('▶ Ao vivo (sem som — clique no player para ativar)', true);
    }).catch(() => {
      overlay.classList.remove('hidden');
      showMsg('');
    });
  });
}

function initPlayer() {
  if (Hls.isSupported()) {
    const hls = new Hls({ lowLatencyMode: true });
    hls.loadSource(SRC);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      showMsg('Stream carregado, iniciando...');
      tryPlay();
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) showMsg('⚠ Erro na transmissão');
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = SRC;
    video.addEventListener('loadedmetadata', tryPlay);
    video.addEventListener('error', () => showMsg('⚠ Erro na transmissão'));
  } else {
    showMsg('⚠ Navegador não suporta HLS');
  }
}

overlay.addEventListener('click', () => {
  video.muted = false;
  tryPlay();
});

document.addEventListener('click', () => {
  if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}, { once: true });

initPlayer();
</script>
</body>
</html>
